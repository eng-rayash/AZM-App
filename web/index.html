  <!-- ═══ Font Face ═════════════════════════════════════════════════ -->
  <style>
    @font-face {
      font-family: 'majallab';
      src: url('assets/fonts/majallab.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #171717;
      font-family: 'majallab', 'Panorama', 'Tajawal', 'Segoe UI', sans-serif;
    }

    #rvios-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #171717 0%, #1a0a0b 50%, #171717 100%);
      color: #FAF8ED;
      gap: 16px;
    }

    #rvios-splash .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #rvios-splash .wordmark-en {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #FAF8ED;
      text-shadow: 0 0 30px rgba(158, 34, 38, 0.6);
    }

    #rvios-splash .wordmark-ar {
      font-size: 1.6rem;
      color: #C8A45D;
      margin-top: -4px;
    }

    #rvios-splash .tagline {
      font-size: 0.85rem;
      color: #C8A45D;
      letter-spacing: 0.08em;
    }

    #rvios-splash .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(158, 34, 38, 0.2);
      border-top: 3px solid #9E2226;
      border-radius: 50%;
      animation: rvios-spin 0.8s linear infinite;
      margin-top: 12px;
    }

    @keyframes rvios-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Splash shown before Flutter loads -->
  <div id="rvios-splash">
    <img src="icons/Icon-192.png" alt="عزم" class="logo-img" />
    <div class="wordmark-en">AZM</div>
    <div class="wordmark-ar">عزم</div>
    <div class="tagline">افهم عملك · احسم ما يهم · نفّذ بعزم</div>
    <div class="loader"></div>
  </div>

  <!-- Flutter app bootstrapper -->
  <script>
    // Hide splash when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('rvios-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>
