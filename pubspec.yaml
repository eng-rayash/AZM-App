name: rvios
description: "RVIOS — One Platform. Complete Business Management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database — drift_flutter handles web (WASM) + native (SQLite) automatically
  drift: ^2.22.1
  drift_flutter: ^0.2.4

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Navigation
  go_router: ^14.8.1

  # UI & Fonts
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Date & Time
  flutter_localizations:
    sdk: flutter
  share_plus: ^12.0.2
  file_picker: ^8.1.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  pdf: ^3.12.0
  image_picker: ^1.1.2
  printing: ^5.13.2
  hijri: ^3.0.0
  open_file: ^3.5.10
  image_cropper: ^8.0.2
  image: ^4.3.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/logo_icon.png
    - assets/images/logo_full.png

  fonts:
    - family: Panorama
      fonts:
        - asset: assets/fonts/majallab.ttf

    - family: majallab
      fonts:
        - asset: assets/fonts/majallab.ttf

    - family: Givonic
      fonts:
        - asset: assets/fonts/Givonic-Regular.otf

    - family: Yapari
      fonts:
        - asset: assets/fonts/YapariTrial-Bold.ttf
          weight: 700
        - asset: assets/fonts/YapariTrial-ExtraBold.ttf
          weight: 800

    - family: RTLMaghfira
      fonts:
        - asset: assets/fonts/rtl-maghfira-ramadan.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  background_color: "#8c1d24"
  adaptive_icon_background: "#8c1d24"
  adaptive_icon_foreground: "assets/icon.png"

