name: azm
description: "AZM — عزم · نظام تشغيل الأعمال الذكي. من RVIOS Technologies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database — drift_flutter handles web (WASM) + native (SQLite) automatically
  drift: ^2.22.1
  drift_flutter: ^0.2.4

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Navigation
  go_router: ^14.8.1

  # UI & Fonts
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Date & Time
  flutter_localizations:
    sdk: flutter
  share_plus: ^12.0.2
  file_picker: ^8.1.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  pdf: ^3.12.0
  image_picker: ^1.1.2
  printing: ^5.13.2
  hijri: ^3.0.0
  open_file: ^3.5.10
  image_cropper: ^8.0.2
  image: ^4.3.0
  url_launcher: ^6.3.0

  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # علامة عزم سمارت — المصدر نفسه الذي تستعمله منصة الويب (public/brand)
    - assets/brand/azmsmart_mark.png
    - assets/brand/azmsmart_icon.png

  fonts:
    # خط ثمانية — النص العربي العام (متن وواجهة).
    # الاسم "Panorama" مُبقى لأنه مذكور نصّياً في ١٤٤ موضعاً عبر ٢٧ ملفاً.
    - family: Panorama
      fonts:
        - asset: assets/fonts/ThmanyahSerifText-Medium.woff2
          weight: 400
        - asset: assets/fonts/ThmanyahSerifText-Bold.woff2
          weight: 700

    # خط زين — العناوين العربية الضخمة والعلامة اللفظية.
    - family: Zain
      fonts:
        - asset: assets/fonts/ZainMobileSwashes-VF.woff2

    # خط يابار — العناوين الإنجليزية الكبيرة والعلامة اللاتينية.
    - family: Yapari
      fonts:
        - asset: assets/fonts/YapariTrial-Bold.woff2
          weight: 700


flutter_launcher_icons:
  # أيقونة عزم سمارت نفسها على كل المنصات: العلامة الكريمية فوق الأحمر
  # (#C1272D)، كما في أيقونة منصة الويب. تُولَّد بـ:
  #   dart run flutter_launcher_icons
  image_path: "assets/brand/launcher_icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#C1272D"
  adaptive_icon_foreground: "assets/brand/launcher_foreground.png"
  ios: true
  remove_alpha_ios: true
  background_color: "#C1272D"
  web:
    generate: true
    image_path: "assets/brand/launcher_icon.png"
    background_color: "#C1272D"
    theme_color: "#C1272D"
  windows:
    generate: true
    image_path: "assets/brand/launcher_icon.png"
    icon_size: 256
